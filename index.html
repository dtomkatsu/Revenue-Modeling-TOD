<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline Revenue vs. Cost — Honolulu</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside id="sidebar">
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Collapse sidebar" title="Collapse sidebar">‹</button>
  <header>
    <h1>Skyline TOD</h1>
    <p class="subtitle">Revenue vs. infrastructure cost per acre</p>
  </header>

  <section class="control">
    <label for="station-select">Station</label>
    <select id="station-select">
      <option value="">— All stations —</option>
    </select>
  </section>

  <section class="control">
    <label>Metric <span class="year-badge year-badge--label">FY2026</span></label>
    <div class="seg" id="mode-toggle" role="radiogroup">
      <button class="seg-btn active" data-mode="revenue" role="radio" aria-checked="true"
        data-tooltip="The property tax this parcel pays the city each year, divided by its size in acres. Higher = more tax revenue per acre of land. (FY2026)">Revenue</button>
      <button class="seg-btn" data-mode="cost" role="radio" aria-checked="false"
        data-tooltip="What it costs the city each year to maintain the roads, water, and sewer pipes serving this parcel, divided by its size in acres. (FY2026)">Cost</button>
      <button class="seg-btn" data-mode="net" role="radio" aria-checked="false"
        data-tooltip="Revenue minus cost. Green = the parcel pays for itself. Red = the city loses money serving it. (FY2026)">Net</button>
    </div>
    <div class="seg-caption" id="seg-caption">all values per acre</div>
  </section>

  <section class="control">
    <label class="check">
      <input type="checkbox" id="extrude-toggle" checked>
      <span>3D extrusion</span>
    </label>
  </section>

  <section class="control">
    <label>Filters</label>
    <div class="filter">
      <div class="filter-head">
        <span class="filter-name">Assessed value</span>
        <span class="filter-val" id="assessed-val">All</span>
      </div>
      <div class="range-dual" data-filter="assessed">
        <div class="range-track"></div>
        <div class="range-fill" id="assessed-fill"></div>
        <input type="range" class="range-min" id="assessed-min" min="0" max="100" step="1" value="0"
          aria-label="Minimum assessed value">
        <input type="range" class="range-max" id="assessed-max-input" min="0" max="100" step="1" value="100"
          aria-label="Maximum assessed value">
      </div>
    </div>
    <div class="filter">
      <div class="filter-head">
        <span class="filter-name">Property tax</span>
        <span class="filter-val" id="tax-val">All</span>
      </div>
      <div class="range-dual" data-filter="tax">
        <div class="range-track"></div>
        <div class="range-fill" id="tax-fill"></div>
        <input type="range" class="range-min" id="tax-min" min="0" max="100" step="1" value="0"
          aria-label="Minimum annual property tax">
        <input type="range" class="range-max" id="tax-max-input" min="0" max="100" step="1" value="100"
          aria-label="Maximum annual property tax">
      </div>
    </div>
    <div class="filter type-filter">
      <div class="filter-head"><span class="filter-name">Property type</span></div>
      <label class="type-check"><input type="checkbox" data-bucket="Residential" checked><span>Residential</span></label>
      <label class="type-check"><input type="checkbox" data-bucket="Multi-family" checked><span>Multi-family (apartments)</span></label>
      <label class="type-check"><input type="checkbox" data-bucket="Commercial" checked><span>Commercial &amp; hotel</span></label>
      <label class="type-check"><input type="checkbox" data-bucket="Industrial" checked><span>Industrial</span></label>
      <label class="type-check"><input type="checkbox" data-bucket="Other" checked><span>Other (Ag, preservation)</span></label>
      <label class="type-check"><input type="checkbox" data-bucket="PublicService"><span>Public Service (gov, utility)</span></label>
    </div>
    <div class="filter-meta">
      <span id="filter-count" class="filter-count"></span>
      <button id="filter-reset" class="filter-reset" hidden>Reset</button>
    </div>
  </section>

  <section class="control">
    <div id="legend" class="legend"></div>
  </section>

  <section class="control">
    <h2>Summary</h2>
    <div id="summary" class="summary">
      <p class="muted">Loading…</p>
    </div>
  </section>

  <footer>
    <p class="muted">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · MapLibre GL JS</p>
  </footer>

  <div id="sidebar-resize" class="sidebar-resize" aria-hidden="true"></div>
</aside>

<div id="map"></div>

<div id="search-box" class="search-box">
  <input id="search-input" type="text" placeholder="Search address or TMK…" autocomplete="off" spellcheck="false">
  <div id="search-results" class="search-results" hidden></div>
</div>

<div id="parcel-tooltip" class="parcel-tooltip" hidden></div>
<div id="parcel-popup" class="parcel-popup" hidden></div>
<div id="summary-tooltip" aria-hidden="true"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"
        integrity="sha384-MjejsnWXHmuz93aE35YWLh5AbS/6ceRB3Vb+ukOwqFzJRTpQ8vvbkLbNV7I0QK4f"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/deck.gl@9.0.32/dist.min.js"></script>
<script src="https://unpkg.com/@deck.gl/mapbox@9.0.32/dist.min.js"></script>
<script src="script.js"></script>
</body>
</html>
