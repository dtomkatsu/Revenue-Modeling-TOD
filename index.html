<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline Revenue vs. Cost — Honolulu</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside id="sidebar">
  <header>
    <h1>Skyline TOD</h1>
    <p class="subtitle">Revenue vs. infrastructure cost per acre</p>
  </header>

  <section class="control">
    <label for="station-select">Station</label>
    <select id="station-select">
      <option value="">— All stations —</option>
    </select>
  </section>

  <section class="control">
    <label>Metric</label>
    <div class="seg" id="mode-toggle" role="radiogroup">
      <button class="seg-btn active" data-mode="revenue" role="radio" aria-checked="true"
        data-tooltip="Annual property tax revenue per acre. Assessed value × FY2026 millage rate by land-use class.">Revenue</button>
      <button class="seg-btn" data-mode="cost" role="radio" aria-checked="false"
        data-tooltip="Annual infrastructure O&amp;M cost per acre — share of road, sewer, and water budgets attributed by parcel frontage.">Cost</button>
      <button class="seg-btn" data-mode="net" role="radio" aria-checked="false"
        data-tooltip="Revenue minus cost. Positive = the parcel pays more in tax than it costs the city to serve.">Net</button>
    </div>
    <div class="seg-caption">all values per acre</div>
  </section>

  <section class="control">
    <label class="check">
      <input type="checkbox" id="extrude-toggle" checked>
      <span>3D extrusion</span>
    </label>
  </section>

  <section class="control">
    <label>Filters</label>
    <div class="filter">
      <div class="filter-head">
        <span class="filter-name">Min assessed value</span>
        <span class="filter-val" id="min-assessed-val">Off</span>
      </div>
      <input type="range" id="min-assessed" class="slider" min="0" max="100" step="1" value="0"
        aria-label="Minimum assessed value">
    </div>
    <div class="filter">
      <div class="filter-head">
        <span class="filter-name">Min property tax</span>
        <span class="filter-val" id="min-tax-val">Off</span>
      </div>
      <input type="range" id="min-tax" class="slider" min="0" max="100" step="1" value="0"
        aria-label="Minimum annual property tax">
    </div>
    <div class="filter-meta">
      <span id="filter-count" class="filter-count"></span>
      <button id="filter-reset" class="filter-reset" hidden>Reset</button>
    </div>
  </section>

  <section class="control">
    <div id="legend" class="legend"></div>
  </section>

  <section class="control">
    <h2>Summary</h2>
    <div id="summary" class="summary">
      <p class="muted">Loading…</p>
    </div>
  </section>

  <footer>
    <p class="muted">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · MapLibre GL JS</p>
  </footer>
</aside>

<div id="map"></div>
<div id="parcel-tooltip" class="parcel-tooltip" hidden></div>
<div id="parcel-popup" class="parcel-popup" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"
        integrity="sha384-MjejsnWXHmuz93aE35YWLh5AbS/6ceRB3Vb+ukOwqFzJRTpQ8vvbkLbNV7I0QK4f"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/deck.gl@9.0.32/dist.min.js"></script>
<script src="https://unpkg.com/@deck.gl/mapbox@9.0.32/dist.min.js"></script>
<script src="script.js"></script>
</body>
</html>
